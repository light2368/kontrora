<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Worklo</title>
  <meta name="description" content="Sign in or create your Worklo account." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/tab-logo.gif" type="image/gif" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 16px 40px;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(59,130,246,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(0,194,168,0.05) 0%, transparent 70%);
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 40px 36px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }
    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .auth-logo img { height: 48px; }
    .auth-tabs {
      display: flex;
      background: var(--elevated);
      border-radius: var(--radius);
      padding: 4px;
      gap: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: var(--font);
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 12px rgba(59,130,246,0.35);
    }
    .auth-form { display: none; flex-direction: column; gap: 16px; }
    .auth-form.active { display: flex; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }
    .field input {
      background: var(--elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .field input.invalid { border-color: var(--error); }
    .auth-error {
      font-size: 0.82rem;
      color: var(--error);
      display: none;
      padding: 10px 14px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius);
    }
    .auth-error.show { display: block; }
    .auth-success-msg {
      font-size: 0.82rem;
      color: var(--success);
      display: none;
      padding: 10px 14px;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: var(--radius);
    }
    .auth-success-msg.show { display: block; }
    .auth-submit {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 16px rgba(59,130,246,0.3);
    }
    .auth-submit:hover:not(:disabled) { background: var(--blue-bright); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .auth-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/images/logo.gif" alt="Worklo" /></a>
    <ul class="nav-links">
      <li><a href="/features">Features</a></li>
      <li><a href="/pricing">Pricing</a></li>
      <li><a href="/roadmap">Roadmap</a></li>
    </ul>
    <div class="nav-actions" id="nav-actions">
      <!-- populated by auth.js -->
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <a href="/"><img src="/images/logo.gif" alt="Worklo" /></a>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <!-- Sign In -->
    <form class="auth-form active" id="form-signin" novalidate>
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" placeholder="you@company.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" placeholder="Your password" autocomplete="current-password" required />
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAC-AceeFZPmXxKB5" data-theme="dark" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired"></div>
      <div class="auth-error" id="si-error"></div>
      <button type="submit" class="auth-submit" id="si-btn" disabled>Sign In</button>
      <div class="auth-divider">or</div>
      <p class="auth-footer">No account? <a href="#" data-switch="signup">Sign up free</a></p>
    </form>

    <!-- Sign Up -->
    <form class="auth-form" id="form-signup" novalidate>
      <div class="field">
        <label for="su-name">Full Name</label>
        <input type="text" id="su-name" placeholder="Jane Smith" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" placeholder="you@company.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
      </div>
      <div class="auth-error" id="su-error"></div>
      <div class="auth-success-msg" id="su-success"></div>
      <button type="submit" class="auth-submit" id="su-btn">Create Account</button>
      <div class="auth-divider">or</div>
      <p class="auth-footer">Already have an account? <a href="#" data-switch="signin">Sign in</a></p>
      <p class="auth-footer" style="margin-top:2px;">
        By signing up you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.
      </p>
    </form>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
  // Tab switching
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('form-' + tab.dataset.tab).classList.add('active');
    });
  });
  document.querySelectorAll('[data-switch]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelector(`.auth-tab[data-tab="${link.dataset.switch}"]`).click();
    });
  });

  const SUPABASE_URL = 'https://swvpmoffserpatwxuxsl.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3dnBtb2Zmc2VycGF0d3h1eHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMDAwMDgsImV4cCI6MjA5MTc3NjAwOH0.rAiHFcYbRY_ZjCVHN67YXyOY9Zs7_B1bUkRrOSoVfIY';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Get return URL from query param
  const returnTo = new URLSearchParams(window.location.search).get('return') || '/';

  // Turnstile
  let turnstileToken = null;
  function onTurnstileSuccess(token) {
    turnstileToken = token;
    document.getElementById('si-btn').disabled = false;
  }
  function onTurnstileExpired() {
    turnstileToken = null;
    document.getElementById('si-btn').disabled = true;
  }

  // If already signed in → go straight to returnTo
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.replace(returnTo);
  });

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearError(id) {
    const el = document.getElementById(id);
    el.textContent = '';
    el.classList.remove('show');
  }

  // Sign In
  document.getElementById('form-signin').addEventListener('submit', async e => {
    e.preventDefault();
    clearError('si-error');
    const email    = document.getElementById('si-email').value.trim();
    const password = document.getElementById('si-password').value;
    if (!email || !password) { showError('si-error', 'Please fill in all fields.'); return; }
    if (!turnstileToken) { showError('si-error', 'Please complete the human verification.'); return; }

    const btn = document.getElementById('si-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showError('si-error', error.message);
      btn.disabled = false; btn.textContent = 'Sign In';
    } else {
      window.location.replace(returnTo);
    }
  });

  // Sign Up
  document.getElementById('form-signup').addEventListener('submit', async e => {
    e.preventDefault();
    clearError('su-error');
    document.getElementById('su-success').classList.remove('show');

    const name     = document.getElementById('su-name').value.trim();
    const email    = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;
    if (!name || !email || !password) { showError('su-error', 'Please fill in all fields.'); return; }
    if (password.length < 8) { showError('su-error', 'Password must be at least 8 characters.'); return; }

    const btn = document.getElementById('su-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
    if (error) {
      showError('su-error', error.message);
      btn.disabled = false; btn.textContent = 'Create Account';
    } else {
      btn.disabled = false; btn.textContent = 'Create Account';
      const success = document.getElementById('su-success');
      success.textContent = 'Account created! You can now sign in.';
      success.classList.add('show');
      // Switch to sign in and prefill email
      setTimeout(() => {
        document.querySelector('.auth-tab[data-tab="signin"]').click();
        document.getElementById('si-email').value = email;
      }, 1500);
    }
  });
</script>
</body>
</html>
